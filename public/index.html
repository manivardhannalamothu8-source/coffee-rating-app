<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee Rating App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>☕ Coffee Rating App</h1>
        <p>Discover, rate and vote for your favorite coffee blends.</p>
    </header>

    <main>

        <!-- Leaderboard -->
        <section class="leaderboard-section">
            <h2>🏆 Top Rated Coffees</h2>

            <div id="leaderboard" class="leaderboard">
                <p>Loading leaderboard...</p>
            </div>
        </section>


        <!-- Coffee List -->
        <section class="coffee-section">

            <div class="section-title">
                <h2>☕ All Coffee Blends</h2>

                <p id="coffee-count">
                    Loading coffees...
                </p>
            </div>

            <div id="coffee-grid" class="coffee-grid">
                <p>Loading coffees...</p>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Coffee Rating App</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
